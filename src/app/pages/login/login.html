<div class="header">
  <img src="/logo raquitich.png" alt="Universidad Raquitich" class="logo">
</div>

<div class="login-container">
</div>
<div class="login-container">
  <div class="login-card">

    <h2>Universidad Raquitich</h2>
    <p>Acceso académico</p>

    <form (ngSubmit)="login()">

      <input
        type="email"
        placeholder="Correo institucional"
        [(ngModel)]="email"
        name="email"
        required
      />

      <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit">Iniciar sesión</button>

    </form>

    <div class="error" *ngIf="error">
      {{ error }}
    </div>

  </div>
</div>
