<div class="login-container">

  <div class="header">
    <img src="/logo.png" class="logo">
  </div>

  <div class="login-card">

    <h2>Universidad Raquitich</h2>

    <p>Acceso Académico Institucional</p>

    <input
      type="email"
      placeholder="Correo institucional"
      [(ngModel)]="email"
    >

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
    >

    <button (click)="login()">
      Iniciar sesión
    </button>

    <div class="error" *ngIf="error">
      {{ error }}
    </div>

  </div>

</div>
